<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 0 520 580" aria-hidden="true">
  <style>
    .draw-in path { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: draw 1.6s cubic-bezier(.16,1,.3,1) .5s forwards; }
    .cut-in { opacity: 0; animation: show .9s ease-out 1.1s forwards; }
    .ship-in { opacity: 0; transform: translate(-40px, 30px) rotate(-8deg); transform-origin: 440px 80px; animation: fly 1.4s cubic-bezier(.16,1,.3,1) .5s forwards; }
    .done-in { opacity: 0; animation: show 1.2s ease-out .4s forwards; }
    /* Hidden until the stroke starts: a zero-length dash with round caps would otherwise show as a dot at each end. */
    @keyframes draw { 0% { opacity: 0; } 2% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes show { to { opacity: 1; } }
    @keyframes fly { to { opacity: 1; transform: none; } }
    .ship-still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .draw-in path, .cut-in, .ship-in, .done-in { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
      .ship-fly { display: none; } .ship-still { display: inline; }
    }
  </style>
  <defs>
    <linearGradient id="st-globe" x1="0.18" y1="0.08" x2="0.82" y2="0.96"><stop offset="0" stop-color="#FF8F3F"/><stop offset="0.45" stop-color="#F56600"/><stop offset="1" stop-color="#B84A00"/></linearGradient>
    <mask id="st-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="640"><rect width="640" height="640" fill="#fff"/></mask>
  </defs>
  <g mask="url(#st-cut)">
    <circle cx="305" cy="306" r="230" fill="#F56600"/>
  </g>
  <g fill="none" stroke="#F1F1EF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
